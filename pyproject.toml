[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-local-sync"
version = "0.1.0"
description = "Read-only Garmin Connect archive and SQLite ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "garminconnect>=0.3.4,<0.4",
  "fitdecode>=0.11,<0.12",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
